<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Reserve Account & Login — SCPSEC Cybersecurity Ecosystem</title>
  <meta name="title" content="Reserve Account & Login — SCPSEC Cybersecurity Ecosystem">
  <meta name="description" content="Access and reserve your early account in the SCPSEC Database. Join the open, next-generation cybersecurity ecosystem for OS, AI, and Security tools.">
  <meta name="keywords" content="SCPSEC Login, SCPSEC Register, SCPSEC Account, Cybersecurity Portal, Scpsec OS, Open Source Security Auth">
  <meta name="robots" content="index, follow, max-image-preview:large">

  <!-- Mastodon Header -->

  <!-- Open Graph / Facebook / LinkedIn -->

  <meta property="og:description" content="Securely authenticate or reserve your developer account in the SCPSEC open security database.">
  <meta property="og:image" content="https://github.com/scpsec/scpsec-logo/blob/main/logo_circle.png?raw=true">

  <!-- Twitter / X Meta Tags -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:site" content="@scpseccompany">
  <meta property="twitter:url" content="https://x.com/scpseccompany">
  <meta property="twitter:title" content="Reserve Your Account — SCPSEC Ecosystem">
  <meta property="twitter:description" content="Securely authenticate or reserve your developer account in the SCPSEC open security database.">
  <meta property="twitter:image" content="https://github.com/scpsec/scpsec-logo/blob/main/logo_circle.png?raw=true">

  <!-- Structured Data (Schema.org JSON-LD for WebPage & LoginAction) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebPage",
        "@id": "https://github.com/scpsec/#login",
        "url": "https://github.com/scpsec/",
        "name": "Reserve Account & Login — SCPSEC Ecosystem",
        "isPartOf": {
          "@type": "WebSite",
          "name": "SCPSEC",
          "url": "https://github.com/scpsec/"
        },
        "description": "Account reservation and authentication portal for SCPSEC Ecosystem."
      },
      {
        "@type": "Organization",
        "name": "SCPSEC",
        "url": "https://github.com/scpsec/",
        "logo": "https://github.com/scpsec/scpsec-logo/blob/main/logo_circle.png?raw=true",
        "sameAs": [
          "https://github.com/scpsec/",
          "https://x.com/scpseccompany"
        ]
      }
    ]
  }
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://github.com/scpsec/scpsec-logo/blob/main/logo_circle.png?raw=true">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBg: '#fdfdfd',
            brandText: '#676768',
            brandPrimary: '#0b3567',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #fdfdfd; color: #676768; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-gray-200">

  <!-- Header -->
  <header class="border-b border-gray-200 bg-white/90 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div>
          <span class="font-extrabold text-2xl tracking-tight text-brandPrimary block leading-none">SCPSEC</span>
          <span class="text-[10px] text-brandText font-mono tracking-widest uppercase">Ecosystem Auth</span>
        </div>
      </a>
      <a href="index.html" class="text-sm font-medium text-brandPrimary hover:underline">&larr; Back to Ecosystem</a>
    </div>
  </header>

  <!-- Auth Card -->
  <main class="flex-grow flex items-center justify-center p-6">
    <article class="w-full max-w-md bg-white border border-gray-200 rounded-2xl p-8 shadow-md">
      
      <header class="text-center mb-6">
        <div class="w-12 h-12 bg-blue-50 border border-blue-100 rounded-xl flex items-center justify-center mx-auto mb-3">
          <span class="text-2xl" aria-hidden="true">🛡️</span>
        </div>
        <h1 class="text-2xl font-bold text-brandPrimary">Reserve Your Account</h1>
        <p class="text-xs text-brandText mt-1">Reserve your first account in <strong class="text-brandPrimary">scpsec database</strong></p>
      </header>

      <!-- Error / Success Alert -->
      <div id="statusAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-mono border" role="alert"></div>

      <!-- Google Provider -->
      <button id="googleBtn" type="button" aria-label="Continue with Google" class="w-full py-2.5 px-4 rounded-xl border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:bg-gray-50 flex items-center justify-center gap-3 transition-all shadow-sm">
        <svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
        <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-400 font-mono">Or Email</span></div>
      </div>

      <!-- Email / Password Form -->
      <form id="authForm" class="space-y-4" aria-label="Email Authentication Form">
        <div>
          <label for="email" class="block text-xs font-semibold text-brandPrimary mb-1 uppercase tracking-wider">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="developer@scpsec.org" class="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-brandPrimary transition-colors">
        </div>
        <div>
          <label for="password" class="block text-xs font-semibold text-brandPrimary mb-1 uppercase tracking-wider">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password" placeholder="••••••••" class="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-brandPrimary transition-colors">
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button type="submit" id="loginBtn" class="w-full py-2.5 rounded-xl bg-brandPrimary text-white text-sm font-medium hover:bg-black transition-all shadow-sm">
            Login
          </button>
          <button type="button" id="signUpBtn" class="w-full py-2.5 rounded-xl bg-gray-100 text-brandPrimary border border-gray-200 text-sm font-medium hover:bg-black hover:text-white transition-all shadow-sm">
            Sign Up
          </button>
        </div>
      </form>

      <footer class="mt-6">
        <p class="text-[11px] text-gray-400 text-center">
          🔒 End-to-End Encrypted Authentication via Firebase TLS v1.3 Standard.
        </p>
      </footer>
    </article>
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 py-6 text-center text-xs text-brandText bg-white">
    &copy; 2026 <a href="https://github.com/scpsec/" target="_blank" rel="noopener noreferrer" class="font-bold text-brandPrimary hover:underline">SCPSEC</a> — Secure Cyber Protection & Security Ecosystem.
  </footer>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7ygu788CCAF7xYtfW6lLMdlkBedkc74U",
      authDomain: "scpsec-database.firebaseapp.com",
      projectId: "scpsec-database",
      storageBucket: "scpsec-database.firebasestorage.app",
      messagingSenderId: "1050590968369",
      appId: "1:1050590968369:web:b5274c5557d1b68332b310",
      measurementId: "G-W79M79ZWG1"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    const alertBox = document.getElementById('statusAlert');

    function showAlert(msg, isError = true) {
      alertBox.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      if (isError) {
        alertBox.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
      } else {
        alertBox.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      }
      alertBox.textContent = msg;
    }

    // Email/Password Login
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        showAlert(`Welcome back ${userCredential.user.email}! Account verified in scpsec database.`, false);
      } catch (err) {
        showAlert(err.message);
      }
    });

    // Email/Password Sign Up
    document.getElementById('signUpBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) {
        showAlert('Please fill in both Email and Password fields.');
        return;
      }
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        showAlert(`Account reserved successfully in scpsec database for ${userCredential.user.email}!`, false);
      } catch (err) {
        showAlert(err.message);
      }
    });

    // Google Sign-In Provider
    document.getElementById('googleBtn').addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        showAlert(`Authenticated via Google as ${result.user.displayName} (${result.user.email})!`, false);
      } catch (err) {
        showAlert(err.message);
      }
    });
  </script>
</body>
</html>
